<div class="ai-social-channel-container">
  @switch (channelCode()) {
    @case ('khan') {
      <app-emergency-channel-view
        [posts]="state.posts()"
        [categories]="state.categories()"
        [loading]="state.loadingPosts()"
        [highlightId]="highlightId()"
        (postCreated)="onPostCreated($event)"
        (postUpdated)="onPostUpdated($event)"
        (postDeleted)="onPostDeleted($event)"
        (shareRequested)="sharingPost.set($event)"
        (statsRequested)="statsModalPost.set($event)"
        (mediaClicked)="lightboxMedia.set($event)"
      />
    }
    @case ('sukien') {
      <app-event-channel-view
        [posts]="state.posts()"
        [categories]="state.categories()"
        [scheduleGroups]="state.upcomingSchedule()"
        [loading]="state.loadingPosts()"
        [highlightId]="highlightId()"
        (postCreated)="onPostCreated($event)"
        (postUpdated)="onPostUpdated($event)"
        (shareRequested)="sharingPost.set($event)"
        (statsRequested)="statsModalPost.set($event)"
        (mediaClicked)="lightboxMedia.set($event)"
      />
    }
    @case ('truyenthong') {
      <app-media-channel-view
        [posts]="state.posts()"
        [categories]="state.categories()"
        [loading]="state.loadingPosts()"
        [highlightId]="highlightId()"
        (postCreated)="onPostCreated($event)"
        (postUpdated)="onPostUpdated($event)"
        (postDeleted)="onPostDeleted($event)"
        (shareRequested)="sharingPost.set($event)"
        (mediaClicked)="lightboxMedia.set($event)"
      />
    }
    @case ('sotay') {
      <app-handbook-channel-view />
    }
  }
</div>

<!-- Share Modal -->
@if (sharingPost(); as sp) {
  <app-ai-social-share-modal
    [visible]="true"
    [post]="sp"
    (visibleChange)="!$event && sharingPost.set(null)"
  />
}

<!-- Post Stats & 3-Tier Reminder Modal -->
@if (statsModalPost(); as statPost) {
  <app-post-stats-modal
    [post]="statPost"
    (closed)="statsModalPost.set(null)"
  />
}

<!-- Media Lightbox Modal -->
@if (lightboxMedia(); as media) {
  <app-media-lightbox-modal
    [visible]="true"
    [items]="media.items"
    [activeIndex]="media.index"
    (visibleChange)="!$event && lightboxMedia.set(null)"
  />
}
